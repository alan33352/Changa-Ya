<style>

:root{color-scheme:light}
button{background:transparent;color:inherit;font-family:inherit}

.pid{padding:0 1.25rem;margin-top:-2.6rem}.pname{margin-top:.7rem}
.vtiles{display:grid;gap:.7rem;grid-template-columns:1fr}@media(min-width:640px){.vtiles{grid-template-columns:repeat(3,1fr)}}
.vt{display:block;cursor:pointer;border:2px dashed var(--line);border-radius:16px;background:var(--soft);transition:border-color .2s,transform .15s}
.vt:hover{border-color:var(--acc)}.vt:active{transform:scale(.98)}.vt.ok{border-style:solid;border-color:var(--acc)}
.vt-in{position:relative;display:grid;place-items:center;align-content:center;gap:.2rem;min-height:120px;padding:.8rem;text-align:center;color:var(--acc);overflow:hidden;border-radius:14px}
.vt-in b{color:var(--ink);font-size:.88rem}.vt-in small{color:var(--mut);font-size:.74rem}.vt-in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vt-c{position:absolute;left:0;right:0;bottom:0;padding:.35rem;font-size:.75rem;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.vst{display:flex;gap:.8rem;align-items:flex-start;padding:1rem;border-radius:14px;background:var(--soft);color:var(--acc)}.vst b{color:var(--ink)}.vst.ok{background:color-mix(in srgb,#1f9d62 14%,var(--card));color:#1f9d62}

/* ===== Foto de perfil y verificaciones (admin) ===== */
.avw{position:relative;overflow:hidden}.avimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pav{position:relative}.avcam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;min-height:34px;border-radius:999px;display:grid;place-items:center;background:var(--acc);color:var(--accink);border:3px solid var(--card);cursor:pointer}
.vgrid{display:grid;gap:.6rem;grid-template-columns:repeat(2,1fr)}@media(min-width:760px){.vgrid{grid-template-columns:repeat(4,1fr)}}
.vph{position:relative;display:block;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line);cursor:zoom-in;padding:0}
.vph img{width:100%;height:100%;object-fit:cover}.vph span.cap{position:absolute;left:0;right:0;bottom:0;padding:.3rem .5rem;font-size:.72rem;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:left}
.vph .none{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:.5rem;font-size:.75rem;color:var(--mut)}
.vfil{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.vzoom{max-width:94vw;max-height:90dvh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.tabbadge{display:inline-block;min-width:1.2rem;margin-left:.35rem;padding:0 .35rem;border-radius:99px;background:var(--warn);color:var(--bg);font-size:.7rem;font-weight:700;text-align:center}
</style>
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-40 border-b" style="background:var(--bg);border-color:var(--line)">
 <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-2 sm:gap-3">
  <div class="flex items-center gap-2 mr-auto min-w-0">
   <svg class="logo w-8 h-8" viewBox="0 0 32 32" fill="none"><rect x="1.5" y="1.5" width="29" height="29" rx="8" stroke="var(--ink)" stroke-width="2"/><path d="M9 21l5-10 3 6 2-3 4 7" stroke="var(--acc)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
   <span class="ser font-bold text-lg truncate" id="brand"></span>
  </div>
  <button id="themeBtn" class="bo px-2.5 sm:px-3 py-1.5 text-sm"></button>
  <div class="relative"><button id="bellBtn" class="bo px-2.5 sm:px-3 py-1.5 text-sm">Avisos <span id="badge" class="ml-1 inline-block min-w-5 px-1 rounded-full text-xs text-center" style="background:var(--warn);color:var(--bg)"></span></button>
   <div id="notif" class="hidden cd absolute right-0 mt-2 w-72 max-w-[85vw] p-2 shadow-lg"></div></div>
  <button id="meBtn" class="bp w-9 h-9 text-sm" aria-label="Mi perfil">MP</button>
 </div>
 <div class="border-t text-xs mut" style="border-color:var(--line)"><div class="max-w-6xl mx-auto px-4 sm:px-6 py-1.5 flex flex-wrap gap-x-5"><span><span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5" style="background:var(--acc)"></span><b class="acc" id="stJobs">0</b> changas activas</span></div></div>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
 <section id="viewHome"></section>
 <section id="viewFind" class="hidden">
  <h1 id="heroT"></h1><p class="mut mt-2 mb-6 max-w-2xl text-base" id="heroS"></p>
  <div class="cd p-3 sm:p-4 space-y-3">
   <input id="q" class="in" placeholder="Buscar: plomero, pintura, flete…">
   <div id="chips" class="flex gap-2 overflow-x-auto pb-1"></div>
   <div class="grid grid-cols-2 lg:grid-cols-5 gap-2">
    <select id="fCat" class="in col-span-2 lg:col-span-1"></select>
    <select id="fPay" class="in"><option value="0">Cualquier pago</option><option value="10000">Más de $10.000</option><option value="25000">Más de $25.000</option><option value="50000">Más de $50.000</option></select>
    <select id="fBar" class="in"></select>
    <select id="fUrg" class="in"><option value="">Cualquier urgencia</option><option value="now">Inmediato</option><option value="today">Hoy</option><option value="week">Esta semana</option></select>
    <select id="fSort" class="in"><option value="t">Más recientes</option><option value="pay">Mejor pago</option></select>
   </div>
  </div>
  <div class="flex items-center justify-between mt-5 mb-3 text-sm mut"><span id="count"></span><button id="clear" class="acc font-medium underline">Limpiar filtros</button></div>
  <div id="feed" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
 </section>
 <section id="viewPost" class="hidden">
  <div class="cd p-6 sm:p-10 text-center fade"><h2 class="text-2xl sm:text-3xl font-bold">¿Necesitás una mano? Publicá tu changa</h2><p class="mut mt-2 max-w-xl mx-auto">En 4 pasos simples tu laburo queda visible para los laburantes de tu zona.</p><button id="newJob" class="bp mt-5 px-6 py-3">Publicar laburo</button></div>
  <h3 class="font-bold text-lg mt-8 mb-3">Mis changas publicadas</h3><div id="mine" class="grid sm:grid-cols-2 gap-4"></div>
  <h3 class="font-bold text-lg mt-8 mb-3">Mis postulaciones</h3><div id="myApps" class="grid sm:grid-cols-2 gap-4"></div>
 </section>
<section id="viewMe" class="hidden"><div id="meBox"></div></section>
</main>
<span id="foot" class="hidden"></span>
<nav id="bnav" aria-label="Principal"><div class="bn-in"><i class="nv-pill" aria-hidden="true"></i><button class="nv" data-r="home"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Inicio</span></button><button class="nv" data-r="find"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 13h18"/></svg><span>Trabajos</span></button><button class="nv" data-r="post"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg><span>Publicar</span></button><button class="nv" data-r="me"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Perfil</span></button></div></nav>
<div id="legal" class="hidden fixed inset-0 z-[58] overflow-y-auto" style="background:var(--bg)"></div>


<!-- MODAL DE INTRODUCCIÓN Y REGISTRO -->
<div id="gate" class="hidden fixed inset-0 z-[45] overflow-y-auto"></div>
<div id="gateBg" aria-hidden="true"><div id="gbSky"></div><div id="gbPh"></div><div id="gbCity"></div><div class="gbshade"></div></div>
<div id="modal" class="hidden fixed inset-0 z-50 ov grid place-items-end sm:place-items-center"></div>
<div id="admin" class="hidden fixed inset-0 z-[55] overflow-y-auto" style="background:var(--bg)"></div>
<div id="modal2" class="hidden fixed inset-0 z-[60] ov grid place-items-end sm:place-items-center"></div>
<div id="toasts" class="fixed z-[70] left-1/2 -translate-x-1/2 bottom-4 flex flex-col gap-2 items-center w-[92vw] max-w-sm pointer-events-none"></div>

<script>
const REC0=/type=recovery/.test(location.hash);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dot=d=>d.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const money=n=>'$'+dot(String(Math.round(Number(n)||0)));
const digits=v=>String(v==null?'':v).replace(/\D/g,'').slice(0,9);
const fmtN=v=>dot(digits(v));
function moneyIn(el,cb){const before=el.value.slice(0,el.selectionStart).replace(/\D/g,'').length,d=digits(el.value);el.value=dot(d);let i=0,n=0;if(before){for(i=0;i<el.value.length;i++){if(/\d/.test(el.value[i])&&++n===before){i++;break}}}try{el.setSelectionRange(i,i)}catch(e){}if(cb)cb(d)}
const lsG=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const CATG=[
['Construcción y hogar',[['albo','Albañilería'],['elec','Electricidad'],['plom','Plomería'],['gas','Gasista'],['pint','Pintura'],['carp','Carpintería'],['herr','Herrería y soldadura'],['dur','Durlock y yesería'],['techo','Techos y zinguería'],['pisos','Pisos y revestimientos'],['aire','Aire acondicionado'],['cerr','Cerrajería'],['vidrio','Vidriería'],['pileta','Mantenimiento de piletas'],['jard','Jardinería y poda'],['limp','Limpieza'],['fumig','Fumigación'],['mont','Armado de muebles'],['ayu','Ayudante / peón']]],
['Servicios personales',[['barb','Barbería'],['pelu','Peluquería'],['unas','Manicuría y uñas'],['maq','Maquillaje y estética'],['masaj','Masajes'],['cuid','Cuidado de personas'],['nini','Niñera'],['masc','Cuidado de mascotas'],['clases','Clases particulares'],['costu','Costura y arreglos']]],
['Gastronomía',[['coc','Cocinero/a'],['ayucoc','Ayudante de cocina'],['pastel','Pastelería y repostería'],['mozo','Mozo/a'],['barman','Barman y coctelería'],['pizza','Pizzero/a y parrillero/a'],['cater','Catering y viandas']]],
['Vehículos y transporte',[['tras','Fletes y mudanzas'],['cond','Chofer / remís'],['repar','Repartidor / delivery'],['mec','Mecánica del automotor'],['moto','Mecánica de motos'],['gom','Gomería'],['lavau','Lavado de autos'],['chap','Chapa y pintura'],['elecau','Electricidad del automotor']]],
['Tecnología y diseño',[['tec','Soporte técnico / PC'],['cel','Reparación de celulares'],['elecd','Service de electrodomésticos'],['camar','Instalación de cámaras'],['web','Diseño web'],['graf','Diseño gráfico'],['foto','Fotografía y video'],['redes','Redes sociales']]],
['Eventos y outros',[['dj','DJ y sonido'],['anim','Animación infantil'],['decor','Decoración y eventos'],['seg','Seguridad / sereno'],['admin','Administrativo / oficina'],['venta','Vendedor/a'],['otro','Otros oficios']]]];
const CATS=Object.fromEntries(CATG.flatMap(g=>g[1]));
const CATGRP=Object.fromEntries(CATG.flatMap(g=>g[1].map(c=>[c[0],g[0]])));
const catOpts=sel=>CATG.map(g=>`<optgroup label="${g[0]}">${g[1].map(c=>`<option value="${c[0]}" ${c[0]===sel?'selected':''}>${c[1]}</option>`).join('')}</optgroup>`).join('');
const URG={now:['Urgente · Cobro hoy','u1'],today:['Para hoy','u2'],week:['Esta semana','u3']};
const CFG0={contact:'',name:'Changa Ya',heroT:'Changas cerca tuyo, al instante',heroS:'Postulate en un toque o escribí directo por WhatsApp.',barrios:''};

let ST={cfg:{...CFG0,...((lsG('chya_st',{})||{}).cfg||{})}};
let V=lsG('chya_v',{theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'});
const saveV=()=>lsS('chya_v',V);
let authed=false,role='find',aTab='res',notifs=[],J=[],AP=new Set(),APPS=[],RV=[],RATE={},ME={id:null,name:''},jobErr=false;
let F={q:'',cat:'',pay:0,bar:'',urg:'',grp:'',sort:'t'};

/* Zonas exactas solicitadas por el usuario */
const ZPOS=[['Centro','Centro'],['Villa Cabello','Villa Cabello'],['Itaembé Miní','Itaembé Miní'],['Itaembé Guazú','Itaembé Guazú'],['Villa Sarita','Villa Sarita'],['El Brete','El Brete']];
const LEG=new Set(['Centro','Villa Cabello','Itaembé Miní','Itaembé Guazú','Villa Sarita','El Brete','Garupá','Candelaria']);
function barGroups(){const ex=ST.cfg.barrios.split(',').map(x=>x.trim()).filter(x=>x&&!LEG.has(x));return [['Zonas Principales',ZPOS],['Otras zonas',[['Garupá','Garupá'],['Candelaria','Candelaria'],...ex.map(b=>[b,b]),['Otras zonas','Otras zonas']]]]}
const barrios=()=>barGroups().flatMap(g=>g[1].map(x=>x[0]));
function barOpts(sel,all){const known=barrios().includes(sel);return (all?`<option value="">${all}</option>`:'')+(sel&&!known?`<option value="${esc(sel)}" selected>${esc(sel)}</option>`:'')+barGroups().map(g=>`<optgroup label="${g[0]}">${g[1].map(([v,l])=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`).join('')}</optgroup>`).join('')}
const live=j=>!j.hidden&&j.status==='open'&&Date.now()-j.t<2592e6;
const jobs=()=>J.filter(live);
const mine=()=>J.filter(j=>j.user===ME.id);
const mode=()=>sb?'shared':'local';

function ago(t){const s=Math.max(1,Math.round((Date.now()-t)/60000));if(s<60)return 'hace '+s+' min';const h=Math.round(s/60);return h<24?'hace '+h+' h':'hace '+Math.round(h/24)+' d'}
const AVV={};
const avUrl=uid=>uid&&typeof SB_URL!=='undefined'?`${SB_URL}/storage/v1/object/public/avatars/${uid}.jpg?v=${AVV[uid]||1}`:'';
function avatar(name,sz='w-9 h-9 text-sm',uid){const c=['#3b6ea5','#4f7f8f','#6a5f9e','#a0623f','#3f7d6b','#7a5c8a'],n=(name||'?').trim()||'?',i=n.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();return `<span class="avw ${sz} rounded-full grid place-items-center font-semibold text-white shrink-0" style="background:${c[n.charCodeAt(0)%6]}">${esc(i)}${uid?`<img class="avimg" src="${avUrl(uid)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`}
function toast(msg,ok=true){const d=document.createElement('div');d.className='pointer-events-auto rounded-lg px-4 py-3 text-sm font-medium shadow-lg';d.style.cssText='animation:toast .3s ease both;background:'+(ok?'var(--ink);color:var(--bg)':'var(--warn);color:var(--bg)');d.textContent=msg;$('toasts').appendChild(d);setTimeout(()=>{d.style.transition='opacity .3s';d.style.opacity='0';setTimeout(()=>d.remove(),300)},3000)}
function notify(t,b){notifs.unshift([t,b,true]);renderNotif()}
function renderNotif(){const n=notifs.filter(x=>x[2]).length;$('badge').textContent=n;$('badge').style.display=n?'inline-block':'none';$('notif').innerHTML=!notifs.length?'<div class="p-2.5 text-sm mut">Sin avisos por ahora.</div>':notifs.slice(0,6).map(x=>`<div class="p-2.5 rounded-lg"><div class="text-sm font-semibold">${esc(x[0])}</div><div class="text-xs mut">${esc(x[1])}</div></div>`).join('')}
function setTheme(t){V.theme=t;document.documentElement.classList.toggle('dark',t==='dark');$('themeBtn').innerHTML=SVG(t==='dark'?SUNP:MOONP,18)+'<span class="ml-1.5 hidden sm:inline">'+(t==='dark'?'Claro':'Oscuro')+'</span>';$('themeBtn').setAttribute('aria-label',t==='dark'?'Cambiar a modo claro':'Cambiar a modo oscuro');document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0f1318':'#f3f6fa';saveV()}
function applyCfg(){const c=ST.cfg;$('brand').innerHTML=esc(c.name);if(role==='home')renderHome();$('heroT').textContent=c.heroT;$('heroS').textContent=c.heroS;$('foot').textContent='© '+new Date().getFullYear()+' '+c.name;document.title=c.name+' · Oficios y changas';const cur=$('fBar').value;$('fBar').innerHTML=barOpts(cur,'Todas las zonas')}
function refreshAll(){applyCfg();renderFeed();if(role==='post')renderMine();if(!$('admin').classList.contains('hidden')&&aTab!=='cfg')renderAdmin()}

const mapJob=r=>({id:r.id,user:r.user_id,title:r.title,cat:r.cat,desc:r.descr,pay:r.pay,barrio:r.barrio,urg:r.urg,photos:r.photos||[],phone:r.phone||'',author:r.author||'Usuario',hidden:!!r.hidden,status:r.status||'open',assigned:r.assigned_to||null,assignedAt:r.assigned_at?Date.parse(r.assigned_at):0,t:Date.parse(r.created_at)});
const starSvg=(on,z=22)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`;
const stars=(r,z=14)=>`<span class="acc">${[0,1,2,3,4].map(i=>starSvg(i<Math.round(r),z)).join('')}</span>`;
const rateTxt=uid=>{const x=RATE[uid];return x?`${stars(x.avg)} ${x.avg.toFixed(1).replace('.',',')} (${x.n})`:'Sin calificaciones'};
const doneCount=uid=>J.filter(x=>x.status==='done'&&(x.user===uid||x.assigned===uid)).length;
const reviewed=jid=>RV.some(r=>r.job_id===jid&&r.reviewer_id===ME.id);
const waLink=(ph,msg)=>`https://wa.me/${String(ph).replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
function jobCard(j,own){
 const u=URG[j.urg]||URG.week,ap=AP.has(j.id),ps=APPS.filter(a=>a.job_id===j.id),asg=ps.find(a=>a.user_id===j.assigned);
 const ph=(j.photos||[]).map(p=>`<img src="${esc(p)}" alt="" class="w-14 h-14 rounded-md object-cover">`).join('');
 const wa=waLink(j.phone,`Hola, vi tu publicación “${j.title}” en la app y me interesa el trabajo. Mi nombre es ${ME.name}.`);
 const own_=`${j.hidden?'<span class="tag u1 self-start">Oculta por el administrador</span>':''}${j.status!=='open'?`<span class="tag u2 self-start">${j.status==='done'?'Realizada':'Asignada'}${asg?' · '+esc(asg.name):''}</span>`:''}
 <div class="text-sm font-medium py-1"><b>${ps.length}</b> ${ps.length===1?'postulante':'postulantes'}</div>
 ${ps.length&&j.status!=='done'?`<div class="space-y-2 divide-y" style="border-color:var(--line)">${ps.map(a=>`<div class="flex items-center gap-3 pt-2 text-sm"><div class="min-w-0 flex-1"><div class="font-semibold truncate">${esc(a.name)}${a.user_id===j.assigned?' <span class="tag u2 ml-1">Elegido</span>':''}</div><div class="text-xs mut">${a.phone?esc(a.phone):'Sin teléfono'}</div></div>${a.phone?`<a class="bo px-2.5 py-1 text-xs" target="_blank" rel="noopener" href="${waLink(a.phone,'Hola '+a.name+', te escribo por la changa “'+j.title+'”.')}">WhatsApp</a>`:''}${j.status==='open'?`<button class="bp px-2.5 py-1 text-xs" onclick="assign('${j.id}','${a.user_id}')">Elegir</button>`:''}</div>`).join('')}</div>`:''}
 <div class="flex flex-wrap gap-2 pt-2">${j.status==='assigned'?`<button class="bp px-3 py-2 text-sm" onclick="setStatus('${j.id}','done')">Marcar como realizada</button><button class="bo px-3 py-2 text-sm" onclick="setStatus('${j.id}','open')">Reabrir</button>`:''}${j.status==='done'&&asg&&!reviewed(j.id)?`<button class="bp px-3 py-2 text-sm" onclick="rateForm('${j.id}','${j.assigned}')">Calificar a ${esc(asg.name)}</button>`:''}${j.status!=='done'?`<button class="bo px-3 py-2 text-sm" onclick="jobForm('${j.id}')">Editar</button>`:''}<button class="bo px-3 py-2 text-sm" style="color:var(--warn)" onclick="delMine('${j.id}',this)">Eliminar</button></div>`;
 return `<article class="card fade cd p-4 flex flex-col gap-3">
 <div class="flex items-center justify-between gap-2"><span class="tag ${u[1]}">${u[0]}</span><span class="text-xs mut">${ago(j.t)}</span></div>
 <div><h3 class="font-bold leading-snug">${esc(j.title)}</h3><p class="text-sm mut mt-1 line-clamp-2 cursor-pointer" onclick="this.classList.toggle('line-clamp-2')" title="Tocá para expandir">${esc(j.desc)}</p></div>
 ${ph?`<div class="flex gap-2">${ph}</div>`:''}
 <div class="flex items-center justify-between gap-2"><div class="ser text-2xl font-bold acc">${money(j.pay)}</div><div class="flex gap-1.5"><span class="tag">${esc(j.barrio)}</span><span class="tag">${CATS[j.cat]||''}</span></div></div>
 ${own?own_:`<button class="flex items-center gap-2 text-left" onclick="openProfile('${j.user}')">${avatar(j.author,undefined,j.user)}<span class="text-sm"><b>${esc(j.author)}</b><br><span class="text-xs mut">${rateTxt(j.user)}</span></span></button>

const STEPS=[['title','cat'],['desc','pay'],['barrio','urg','phone'],[]];
const stepOk=()=>STEPS[w.step-1].every(f=>!VAL[f](w[f]));
function openWizard(){w={step:1,title:'',cat:'',desc:'',pay:'',barrio:'',urg:'',phone:V.phone||'',photos:[]};drawWizard()}
function fld(f,v){w[f]=v;const e=$('e_'+f);if(e)e.textContent=VAL[f](v);$('next').disabled=!stepOk()}
function pick(f,v){w[f]=v;drawWizard()}
function drawWizard(){const s=w.step,err=f=>`<p id="e_${f}" class="text-xs mt-1 min-h-4" style="color:var(--warn)">${w[f]?VAL[f](w[f]):''}</p>`;let b='';
 if(s===1)b=`<label class="text-sm font-semibold">¿Qué necesitás?</label><input class="in mt-1" value="${esc(w.title)}" oninput="fld('title',this.value)" placeholder="Ej: Cambiar canilla de la cocina">${err('title')}<label class="text-sm font-semibold">Categoría</label><select class="in mt-1" onchange="pick('cat',this.value)"><option value="">Elegí un oficio</option>${catOpts(w.cat)}</select>${err('cat')}`;
 if(s===2)b=`<label class="text-sm font-semibold">Descripción detallada</label><textarea rows="4" class="in mt-1" oninput="fld('desc',this.value)" placeholder="Contá qué hay que hacer, materiales, horarios…">${esc(w.desc)}</textarea>${err('desc')}<label class="text-sm font-semibold">Pago ofrecido (ARS)</label><input inputmode="numeric" autocomplete="off" class="in mt-1" value="${fmtN(w.pay)}" oninput="moneyIn(this,d=>fld('pay',d))" placeholder="25.000">${err('pay')}`;
 if(s===3)b=`<label class="text-sm font-semibold">Zona</label><select class="in mt-1" onchange="pick('barrio',this.value)"><option value="">Elegí una zona</option>${barOpts(w.barrio)}</select>${err('barrio')}<label class="text-sm font-semibold">Urgencia</label><div class="grid grid-cols-3 gap-2 mt-1">${[['now','Inmediato'],['today','Hoy'],['week','Esta semana']].map(([k,n])=>`<button class="py-2.5 text-sm ${w.urg===k?'bp':'bo'}" onclick="pick('urg','${k}')">${n}</button>`).join('')}</div>${err('urg')}<label class="text-sm font-semibold">WhatsApp de contacto</label><input inputmode="tel" class="in mt-1" value="${esc(w.phone)}" oninput="fld('phone',this.value)" placeholder="5493764123456">${err('phone')}<p class="text-xs mut mt-1">Con código de país y área, sin espacios. Lo verán los usuarios registrados.</p>`;
 if(s===4)b=`<label class="text-sm font-semibold">Fotos de referencia (opcional, hasta 3)</label><input type="file" accept="image/*" multiple class="in mt-1 text-sm" onchange="addPhotos(this.files)"><div class="flex gap-2 mt-2">${w.photos.map(p=>`<img src="${p}" alt="" class="w-16 h-16 rounded-md object-cover">`).join('')}</div><div class="mt-4 rounded-lg p-3 text-sm space-y-1" style="background:var(--soft)"><b>${esc(w.title)}</b><div class="acc font-bold">${money(w.pay)}</div><div class="mut">${esc(w.barrio)} · ${URG[w.urg][0]}</div></div>`;
 openModal(`<div class="${sheet}" style="${sheetS}"><div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg">Publicar laburo</h3><button class="text-xl" onclick="closeModal()" aria-label="Cerrar">×</button></div><div class="flex gap-1.5 mb-4">${[1,2,3,4].map(i=>`<div class="h-1 flex-1 rounded-full" style="background:${i<=s?'var(--acc)':'var(--line)'}"></div>`).join('')}</div><div class="fade">${b}</div><div class="flex gap-2 mt-5">${s>1?'<button class="bo flex-1 py-2.5" onclick="w.step--;drawWizard()">Atrás</button>':''}<button id="next" class="bp flex-1 py-2.5" ${stepOk()?'':'disabled'} onclick="nextStep()">${s===4?'Publicar':'Siguiente'}</button></div></div>`)}
async function nextStep(){if(!stepOk())return;if(w.step<4){w.step++;return drawWizard()}
 if(!sb)return toast('Sin conexión con el servidor.',false);const b=$('next');b.disabled=true;
 const {data,error}=await sb.from('jobs').insert({title:w.title.trim(),cat:w.cat,descr:w.desc.trim(),pay:+w.pay,barrio:w.barrio,urg:w.urg,phone:w.phone.replace(/\D/g,''),photos:w.photos,author:ME.name||'Usuario'}).select().single();
 if(error){b.disabled=false;return toast(/limite_diario/.test(error.message||'')?'Llegaste al límite de 5 publicaciones por día.':'No se pudo publicar. Probá de nuevo.',false)}

let fails=0,lockUntil=0;
function openAdmin(){if(authed)return showAdmin();
 openModal(`<div class="${sheet}" style="${sheetS}"><div class="flex justify-between items-start"><div><h3 class="font-bold text-lg">Acceso de administrador</h3><p class="text-sm mut mt-1">Ingresá tus tres datos para abrir el panel.</p></div><button class="text-xl" onclick="closeModal()" aria-label="Cerrar">×</button></div><div class="mt-4 space-y-3"><div><label class="text-sm font-semibold">Correo electrónico</label><input id="aE" type="email" autocomplete="username" class="in mt-1"></div>${pwField('aP','Contraseña','current-password')}<div><label class="text-sm font-semibold">DNI</label><input id="aD" inputmode="numeric" class="in mt-1" placeholder="Solo números"></div></div><p id="aErr" class="text-sm mt-3 min-h-5" style="color:var(--warn)"></p><button id="aGo" class="bp w-full py-2.5 mt-2" onclick="doLogin()">Entrar</button></div>`)}
async function doLogin(){const err=m=>{$('aErr').textContent=m},e=$('aE').value.trim().toLowerCase(),p=$('aP').value,d=$('aD').value.replace(/[.\s]/g,'');
 if(!sb)return err('Falta configurar Supabase.');
 if(Date.now()<lockUntil)return err('Demasiados intentos. Esperá '+Math.ceil((lockUntil-Date.now())/1000)+' s.');
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return err('Ingresá un correo válido.');
 if(!/^\d{7,8}$/.test(d))return err('El DNI debe tener 7 u 8 números.');
 $('aGo').disabled=true;
 try{const {data:ad,error}=await sb.auth.signInWithPassword({email:e,password:p});let ok=false;
  if(!error){if(ad&&ad.user&&ME.id!==ad.user.id)await startSession(ad.user);const r=await sb.rpc('site_admin_check',{p_dni:d});ok=r.data===true}
  if(!ok){fails++;if(fails>=5){lockUntil=Date.now()+60000;fails=0}$('aGo').disabled=false;return err('Los datos no son correctos.')}
  fails=0;authed=true;closeModal();showAdmin()}catch(x){$('aGo').disabled=false;err('No hay conexión con el servidor.')}}

 ov.innerHTML=`<div class="sxp" role="listbox"><div class="sxh"><b>${esc(SXT[sel.id]||sel.getAttribute('aria-label')||'Elegí una opción')}</b><button type="button" class="sxx" aria-label="Cerrar">${SVG('<path d="M6 6l12 12M18 6L6 18"/>',18)}</button></div>${many?'<div class="sxsw"><input class="in sxs" placeholder="Buscar…" autocomplete="off"></div>':''}<div class="sxl"></div></div>`;
 const L=ov.querySelector('.sxl');
 const draw=q=>{q=norm(q||'');let h='',g='',gh=0;items.forEach(it=>{if(it.g!==undefined){g=`<div class="sxg">${esc(it.g)}</div>`;gh=0;return}const o=it.o;if(q&&!norm(o.textContent).includes(q))return;if(g&&!gh){h+=g;gh=1}h+=`<button type="button" class="sxo ${o.index===sel.selectedIndex?'on':''}" role="option" data-i="${o.index}"><span>${esc(o.textContent)}</span>${o.index===sel.selectedIndex?SVG('<path d="M5 12.5l4.5 4.5L19 7.5"/>',18):''}</button>`});L.innerHTML=h||'<p class="sxe">No hay resultados.</p>'};
 draw();
 const close=()=>{document.removeEventListener('keydown',k,true);ov.classList.add('out');setTimeout(()=>ov.remove(),180)},k=e=>{if(e.key==='Escape'){e.stopPropagation();close()}};
 document.addEventListener('keydown',k,true);
 ov.onclick=e=>{if(e.target===ov||e.target.closest('.sxx'))return close();const b=e.target.closest('.sxo');if(b){sel.selectedIndex=+b.dataset.i;sel.dispatchEvent(new Event('change',{bubbles:true}));sxSync(sel);close()}};
 const inp=ov.querySelector('.sxs');if(inp){inp.oninput=()=>draw(inp.value)}
 document.body.appendChild(ov);const on=L.querySelector('.on');if(on)on.scrollIntoView({block:'center'});if(inp&&matchMedia('(pointer:fine)').matches)inp.focus()}
const sxScan=()=>document.querySelectorAll('select').forEach(sxEnhance);
new MutationObserver(sxScan).observe(document.body,{childList:true,subtree:true});sxScan();setInterval(()=>document.querySelectorAll('select').forEach(sxSync),400);
/* VERIFICACIÓN CON FOTOS */
let VF={},VU={};
const VK=[['front','DNI: frente','<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h4M6 16c.6-1.6 5.4-1.6 6 0"/>'],['back','DNI: dorso','<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 14h6"/>'],['self','Tu rostro (selfie)','<circle cx="12" cy="9" r="4"/><path d="M5 20c0-3.5 3.5-5 7-5s7 1.5 7 5"/>']];
const tileH=k=>{const v=VK.find(x=>x[0]===k);return VU[k]?`<img src="${VU[k]}" alt=""><span class="vt-c">Cambiar foto</span>`:`${SVG(v[2],30)}<b>${v[1]}</b><small>Tocá para ${k==='self'?'sacar o elegir':'subir'} la foto</small>`};
function verHtml(lock,p){if(lock)return `<div class="vst ${VER==='approved'?'ok':''}">${SVG(VER==='approved'?'<path d="M5 12.5l4.5 4.5L19 7.5"/>':'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',22)}<div><b>${VER==='approved'?'Tu cuenta está verificada.':'Recibimos tus datos.'}</b><p class="text-sm mut">${VER==='approved'?'Tu perfil muestra la insignia de verificada.':'Estamos revisando tu identidad. Te avisamos cuando termine.'}</p></div></div>`;
 return `${VER==='rejected'?'<p class="text-sm font-semibold mb-3" style="color:var(--warn)">No pudimos validar tus datos. Volvé a enviarlos con fotos más claras.</p>':''}
 <div class="vtiles">${VK.map(v=>`<label class="vt ${VU[v[0]]?'ok':''}" id="vt_${v[0]}"><div class="vt-in">${tileH(v[0])}</div><input type="file" accept="image/*" ${v[0]==='self'?'capture="user"':''} hidden onchange="pickF('${v[0]}',this)"></label>`).join('')}</div>
 <ul class="tips"><li>Que el DNI se vea completo, con buena luz y sin reflejos.</li><li>En la selfie mostrá tu rostro descubierto, sin lentes de sol ni gorra.</li></ul>
 <div class="pg two"><div><label>Número de DNI</label><input id="vD" class="in" inputmode="numeric" maxlength="9" placeholder="Sin puntos" oninput="vChk()"></div><div><label>Teléfono de contacto</label><input id="vT" class="in" inputmode="tel" value="${esc(p.tel||'')}" oninput="vChk()"></div></div>
 <p class="text-xs mut mt-2">Tus fotos se guardan de forma privada y solo las revisa el equipo de verificación. No se muestran a otros usuarios.</p><button id="vGo" class="bp mt-3 px-6" onclick="sendVer()" disabled>Enviar para verificar</button>`}
function vChk(){const b=$('vGo');if(b)b.disabled=!(VF.front&&VF.back&&VF.self&&digits($('vD').value).length>=7&&phd($('vT').value).length>=8)}
function shrink(f,m=1400){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};im.onerror=()=>no();im.src=u})}
async function pickF(k,inp){const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('Elegí un archivo de imagen.',false);
 try{const b=await shrink(f);if(VU[k])URL.revokeObjectURL(VU[k]);VF[k]=b;VU[k]=URL.createObjectURL(b);const t=$('vt_'+k);t.classList.add('ok');t.querySelector('.vt-in').innerHTML=tileH(k);vChk()}catch(e){toast('No se pudo leer la imagen.',false)}}
async function sendVer(){if(!sb)return toast('Falta configurar Supabase.',false);const d=digits($('vD').value),t=phd($('vT').value);if(d.length<7)return toast('Ingresá un DNI válido.',false);if(t.length<8)return toast('Ingresá un teléfono válido.',false);if(!(VF.front&&VF.back&&VF.self))return toast('Faltan las fotos.',false);
 const bt=$('vGo'),id=ME.id+'/'+Date.now(),Pt={};bt.disabled=true;bt.textContent='Enviando…';
 try{for(const k of ['front','back','self']){const path=`${id}_${k}.jpg`,{error}=await sb.storage.from('verifications').upload(path,VF[k],{contentType:'image/jpeg'});if(error)throw error;Pt[k]=path}
  const {error}=await sb.from('verifications').insert({user_id:ME.id,dni:d,phone:t,dni_front:Pt.front,dni_back:Pt.back,selfie:Pt.self,status:'pending'});if(error)throw error;
  Object.values(VU).forEach(u=>URL.revokeObjectURL(u));VF={};VU={};VER='pending';toast('Datos enviados. Los revisamos a la brevedad.');renderMe(1)}
 catch(e){bt.disabled=false;bt.textContent='Enviar para verificar';toast('No se pudo enviar. Probá de nuevo más tarde.',false)}}

/* FOTO DE PERFIL */
function meBtnSet(){const b=$('meBtn');if(!b||!ME.id)return;const t=(((ME.n||'')[0]||'')+((ME.a||'')[0]||'')).toUpperCase()||'YO';b.innerHTML=esc(t)+`<img class="avimg" src="${avUrl(ME.id)}" alt="" onerror="this.remove()">`}
function cropSq(f,m=512){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),o=Math.min(m,s),c=document.createElement('canvas');c.width=c.height=o;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,o,o);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};im.onerror=()=>no();im.src=u})}
async function pickAvatar(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(!/^image\//.test(f.type))return toast('Elegí un archivo de imagen.',false);if(!sb)return toast('Falta configurar Supabase.',false);
 try{toast('Subiendo foto…');const b=await cropSq(f),{error}=await sb.storage.from('avatars').upload(ME.id+'.jpg',b,{contentType:'image/jpeg',upsert:true,cacheControl:'300'});if(error)throw error;AVV[ME.id]=Date.now();meBtnSet();renderMe(1);renderFeed();toast('Foto de perfil actualizada')}
 catch(e){toast('No se pudo subir la foto. Probá de nuevo.',false)}}
async function delAvatar(){if(!sb)return;const {error}=await sb.storage.from('avatars').remove([ME.id+'.jpg']);if(error)return toast('No se pudo quitar la foto.',false);AVV[ME.id]=Date.now();meBtnSet();renderMe(1);renderFeed();toast('Foto quitada')}

/* ADMIN: SOLICITUDES DE VERIFICACIÓN */
let VQ={f:'pending',n:0};
const zoomImg=u=>openModal(`<div class="p-3" style="display:grid;place-items:center"><img class="vzoom" src="${u}" alt=""><button class="bp mt-3 px-6" onclick="closeModal('modal2')">Cerrar</button></div>`,'modal2');
function verTab(){setTimeout(loadVerifs,0);return '<div id="verBox" class="text-sm mut">Cargando solicitudes…</div>'}
async function verCount(){if(!sb)return;try{const {count}=await sb.from('verifications').select('user_id',{count:'exact',head:true}).eq('status','pending');VQ.n=count||0;const t=$('verBadge');if(t){t.textContent=VQ.n;t.style.display=VQ.n?'inline-block':'none'}}catch(e){}}
async function loadVerifs(){const box=$('verBox');if(!box)return;if(!sb){box.textContent='Supabase no está configurado.';return}
 const {data,error}=await sb.from('verifications').select('*').order('created_at',{ascending:false}).limit(200);
 if(error){box.innerHTML='<div class="cd p-4" style="color:var(--warn)">No se pudieron cargar las solicitudes: '+esc(error.message)+'<br><span class="mut">Revisá que ejecutaste el archivo supabase_verificaciones.sql.</span></div>';return}
 const all=data||[],cnt=k=>all.filter(v=>v.status===k).length;VQ.n=cnt('pending');
 const list=all.filter(v=>v.status===VQ.f).slice(0,30),ids=[...new Set(list.map(v=>v.user_id))];
 let prof={};if(ids.length){const r=await sb.from('profiles').select('id,nombre,apellido,email').in('id',ids);(r.data||[]).forEach(x=>prof[x.id]=x)}
 let urls={};const paths=list.flatMap(v=>[v.dni_front,v.dni_back,v.selfie]).filter(Boolean);
 if(paths.length){const r=await sb.storage.from('verifications').createSignedUrls(paths,1800);(r.data||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl})}
 const dniUsers={};all.forEach(v=>{(dniUsers[v.dni]||(dniUsers[v.dni]=new Set())).add(v.user_id)});
 const ph=(u,cap)=>u?`<button type="button" class="vph" onclick="zoomImg('${u}')"><img src="${u}" alt="${cap}" loading="lazy"><span class="cap">${cap}</span></button>`:`<div class="vph" style="cursor:default"><div class="none">${cap}: no se pudo cargar</div></div>`;
 const fil=[['pending','Pendientes'],['approved','Aprobadas'],['rejected','Rechazadas']];
 box.innerHTML=`<div class="vfil">${fil.map(([k,l])=>`<button class="${VQ.f===k?'bp':'bo'} px-4 text-sm" onclick="VQ.f='${k}';loadVerifs()">${l} (${cnt(k)})</button>`).join('')}</div>
 <div class="space-y-3">${list.length?list.map(v=>{const u=prof[v.user_id]||{},nm=((u.nombre||'')+' '+(u.apellido||'')).trim()||'Usuario',dup=dniUsers[v.dni]&&dniUsers[v.dni].size>1,key=encodeURIComponent(JSON.stringify([v.id==null?null:v.id,v.user_id,v.created_at]));
  return `<div class="cd p-4 ${v.status!=='pending'?'opacity-90':''}"><div class="flex flex-wrap items-start gap-3 mb-3"><div class="flex items-center gap-3 mr-auto min-w-0">${avatar(nm,'w-12 h-12 text-base',v.user_id)}<div class="min-w-0"><div class="font-semibold truncate">${esc(nm)}</div><div class="text-xs mut truncate">${esc(u.email||'')}</div><div class="text-xs mut">${ago(Date.parse(v.created_at))}</div></div></div>
  <div class="text-sm text-right"><div><b>DNI:</b> ${esc(v.dni)}</div><div><b>Tel:</b> ${esc(v.phone||'')}</div>${dup?'<span class="tag u1 mt-1">DNI repetido en otra cuenta</span>':''}</div></div>
  <div class="vgrid">${ph(urls[v.dni_front],'DNI frente')}${ph(urls[v.dni_back],'DNI dorso')}${ph(urls[v.selfie],'Selfie')}<div class="vph" style="cursor:zoom-in" onclick="zoomImg('${avUrl(v.user_id)}')"><img src="${avUrl(v.user_id)}" alt="Foto de perfil" onerror="var q=this.parentNode;q.innerHTML='<div class=&quot;none&quot;>Sin foto de perfil</div>';q.style.cursor='default';q.onclick=null"><span class="cap">Foto de perfil</span></div></div>
  <p class="text-xs mut mt-2">Compará que la cara del DNI, la selfie y la foto de perfil sean la misma persona y que los datos coincidan.</p>
  ${v.status==='pending'?`<div class="flex flex-wrap gap-2 mt-3"><button class="bp px-5 text-sm" onclick="verAct('${key}','approved',this)">Aprobar</button><button class="bo px-4 text-sm" style="color:var(--warn)" onclick="verAct('${key}','rejected',this)">Rechazar</button></div>`:`<div class="mt-3 flex gap-2 items-center"><span class="tag ${v.status==='approved'?'u2':'u1'}">${v.status==='approved'?'Aprobada':'Rechazada'}</span>${v.status==='rejected'?`<button class="bo px-3 text-xs" onclick="verAct('${key}','approved',this)">Aprobar igual</button>`:`<button class="bo px-3 text-xs" style="color:var(--warn)" onclick="verAct('${key}','rejected',this)">Revocar</button>`}</div>`}</div>`}).join(''):`<div class="cd p-8 text-center mut">No hay solicitudes ${VQ.f==='pending'?'pendientes':VQ.f==='approved'?'aprobadas':'rechazadas'}.</div>`}</div>`;
 const t=$('verBadge');if(t){t.textContent=VQ.n;t.style.display=VQ.n?'inline-block':'none'}}
async function verAct(key,st,btn){const [id,uid,ca]=JSON.parse(decodeURIComponent(key));
 if(!btn.dataset.s){btn.dataset.s=1;const o=btn.textContent;btn.textContent='Confirmar '+(st==='approved'?'aprobación':st==='rejected'&&o==='Revocar'?'revocación':'rechazo');setTimeout(()=>{if(btn.isConnected){delete btn.dataset.s;btn.textContent=o}},4000);return}
 btn.disabled=true;let q=sb.from('verifications').update({status:st});q=id!=null?q.eq('id',id):q.eq('user_id',uid).eq('created_at',ca);
 const {data,error}=await q.select();if(error||!data||!data.length){btn.disabled=false;return toast('No se pudo actualizar. Revisá los permisos de admin (SQL).',false)}
 toast(st==='approved'?'Cuenta verificada':'Solicitud rechazada');loadVerifs()}

addEventListener('resize',navPill);addEventListener('scroll',()=>document.querySelector('header').classList.toggle('sc',scrollY>4),{passive:true});
